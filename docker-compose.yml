services:
  mysql:
    image: mysql:8.0
    container_name: rayw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rent_as_you_wish
      MYSQL_USER: rent
      MYSQL_PASSWORD: rent123
    ports:
      - "3306:3306"
    volumes:
      - rayw_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rayw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rayw_redis_data:/data

volumes:
  rayw_mysql_data:
  rayw_redis_data:
